# Daily upstream sync into this fork's long-lived customization line.
#
# Branch model (2026-10-23):
#   stack (default) = upstream main merged with this fork's customizations
#                     (our picked/ported commits + CI/install files). ALL
#                     releases — rolling `latest` and pinned vNN-stack tags —
#                     build from it. This workflow merges tiann/hapi main into
#                     stack daily; the rolling build.yml cron (~06:43) then
#                     republishes `latest` from the merged line.
#   main            = frozen legacy (pre-2026-10-23 rolling-build source).
#                     Deliberately no longer synced or built.
#
# The merge discards upstream .github/workflows changes BEFORE committing: the
# Actions GITHUB_TOKEN cannot push workflow-file changes (see the 08-15/08-16
# incidents) and this fork manages its own workflow set. Clean merges auto-push
# (note: GITHUB_TOKEN pushes never re-trigger workflows — the daily build cron
# picks the result up instead); merge conflicts fail loudly for manual
# resolution, which is correct for a curated line.
name: sync-upstream

on:
  schedule:
    # daily ~06:37 UTC (off the :00/:30 marks)
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
# NOTE: there is NO "workflows" permission key for GITHUB_TOKEN in workflow YAML
# (it parsed-fail → this workflow stopped registering/scheduling 08-15). Actions
# tokens can never push .github/workflows changes — so the merge step below
# DISCARDS any upstream workflow-file changes instead.

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/tiann/hapi.git
          git fetch upstream main

      - name: merge upstream/main into stack
        id: merge
        run: |
          set -eu
          BEFORE=$(git rev-parse HEAD)
          # Discard upstream changes to workflow files BEFORE committing the merge:
          # the Actions GITHUB_TOKEN cannot push .github/workflows/* changes, so a
          # merge carrying them would be rejected at push (root cause of the
          # 08-13/08-14 sync failures). We keep this fork's workflow set as-is.
          git merge upstream/main --no-commit --no-ff || true
          if [ -z "$(git rev-parse -q --verify MERGE_HEAD)" ]; then
            echo "stack: already up to date"
            exit 0
          fi
          if ! git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            git commit --no-edit
          else
            git checkout HEAD -- .github/workflows/
            # also drop NEW workflow files upstream may have added
            for f in $(git diff --cached --name-only --diff-filter=A | grep '^\.github/workflows/' || true); do
              git rm --cached -q "$f" && rm -f "$f"
            done
            git diff --cached --quiet && { echo "merge was workflow-only; nothing to do"; git merge --abort 2>/dev/null || true; exit 0; } || true
            git commit --no-edit
          fi
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "stack advanced: $BEFORE -> $AFTER (workflow-file changes discarded)"
          fi

      - name: push stack
        if: steps.merge.outputs.changed == 'true'
        run: git push origin stack
