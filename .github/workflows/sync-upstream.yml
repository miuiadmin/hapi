# Daily upstream sync.
# This fork only ADDS files (patches/, workflows/, install.sh, README) on top of
# upstream — it never modifies tracked source — so merging upstream/main is always
# conflict-free. When upstream advances, this merges + pushes, which triggers build.yml.
name: sync-upstream

on:
  schedule:
    # daily ~06:37 UTC (off the :00/:30 marks)
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
# NOTE: there is NO "workflows" permission key for GITHUB_TOKEN in workflow YAML
# (it parsed-fail → this workflow stopped registering/scheduling 08-15). Actions
# tokens can never push .github/workflows changes — so the merge step below
# DISCARDS any upstream workflow-file changes instead. This fork manages its own
# workflow set; upstream workflow churn (e.g. test.yml) is irrelevant here.

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/tiann/hapi.git
          git fetch upstream main

      - name: merge upstream/main
        id: merge
        run: |
          BEFORE=$(git rev-parse HEAD)
          # Discard upstream changes to workflow files BEFORE committing the merge:
          # the Actions GITHUB_TOKEN cannot push .github/workflows/* changes, so a
          # merge carrying them would be rejected at push (root cause of the
          # 08-13/08-14 sync failures). We keep this fork's workflow set as-is.
          git merge upstream/main --no-commit --no-ff || true
          if ! git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            git merge --continue 2>/dev/null || git commit --no-edit
          else
            git checkout HEAD -- .github/workflows/
            git add .github/workflows/ 2>/dev/null || true
            # also drop NEW workflow files upstream may have added
            for f in $(git diff --cached --name-only --diff-filter=A | grep '^\.github/workflows/' || true); do
              git rm --cached -q "$f" && rm -f "$f"
            done
            git diff --cached --quiet && { echo "merge was workflow-only; nothing to do"; git merge --abort 2>/dev/null || true; exit 0; } || true
            git commit --no-edit
          fi
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "advanced: $BEFORE -> $AFTER (workflow-file changes discarded)"
          else
            echo "already up to date"
          fi

      - name: push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main
