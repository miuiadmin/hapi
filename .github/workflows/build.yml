# Build hapi with the embedded tunwg/WireGuard tunnel component stripped, for all
# platforms, and publish to a rolling "latest" release.
#
# Branch model (2026-10-23): `stack` is this fork's default branch — upstream
# main merged with our customizations (sync-upstream.yml merges daily). ALL
# releases build from it: the rolling `latest` (this workflow's push/daily
# triggers) IS the fork's distribution line, not a pristine upstream mirror;
# pinned stack tags come from manual dispatches with a `tag` input. The frozen
# `main` branch is legacy and no longer built.
#
# Why: hapi embeds tunwg (github.com/tiann/tunwg, a WireGuard userspace tunnel) for
# its optional public-relay feature. That binary makes network scanners flag the word
# "wireguard", which some corporate infosec policies prohibit. Self-hosted-hub setups
# don't use the relay, so stripping it costs nothing and produces a scanner-clean binary.
#
# Safety net: the verify step greps every produced exe for "wireguard" and fails the
# build if any hit is found — so if a future hapi version re-introduces it, we notice.
#
# Android: alongside the CLI binaries, each release also ships TWO signed APKs,
# both with the same fork upload keystore (constant signing identity):
#  - hapi-android-*.apk — the native client. It is built Firebase-free (no google-services.json → the
# google-services plugin is skipped by design; all session features work, FCM
# push is unavailable) and signed with this fork's own upload keystore, held in
# repo secrets — the same HAPI_UPLOAD_KEYSTORE* hooks upstream's official build
# uses, minus the hapiOfficialBuild Firebase validation. Persistent signing
# identity matters: a stable key keeps the install/upgrade path intact across
# releases (a fresh key per build would force uninstall/reinstall).
#  - hapi-web-*.apk — the android-web/ WebView shell (fork-only, never PR'd
#    upstream); its job builds web/dist itself for the bundled static layer.
#
# versionCode is yyyymmddNN (date * 100 + run_number%100): monotonic across days
# and across same-day reruns (run_attempt is 1 on every fresh run, so two tagged
# builds on one UTC day collided — v18/v19 both got 2026102401). run_number is
# repo-monotonic; %100 wraps only beyond 100 runs/day.
# and same-day re-runs, and stays within the Android Int32 limit. versionName
# tracks the CLI/hub release train from cli/package.json.
name: build

on:
  push:
    branches: [stack]
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (default: latest). Use a pinned tag to publish a stack build without touching the rolling latest.'
        default: 'latest'
        required: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.ver.outputs.v }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: apply strip patch
        run: git apply --verbose patches/strip-tunwg.patch

      - name: install
        run: bun install

      - name: build all platforms
        run: bun run build:single-exe:all

      - name: verify wireguard stripped (fail if any hit)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            n=$(grep -aci wireguard "$f" || true)
            echo "::notice::$f wireguard hits = $n"
            [ "$n" -ne 0 ] && { echo "::error::$f still contains wireguard"; fail=1; }
          done < <(find cli/dist-exe -type f \( -name hapi -o -name 'hapi.exe' \))
          exit "$fail"

      - name: stage artifacts
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cd cli/dist-exe
          for d in bun-*/; do
            plat="${d%/}"
            short="${plat#bun-}"        # darwin-arm64, linux-x64, win32-x64, ...
            if [ -f "${d}hapi" ]; then
              cp "${d}hapi" "$GITHUB_WORKSPACE/stage/hapi-${short}"
            fi
            if [ -f "${d}hapi.exe" ]; then
              cp "${d}hapi.exe" "$GITHUB_WORKSPACE/stage/hapi-${short}.exe"
            fi
          done
          chmod +x "$GITHUB_WORKSPACE/stage"/hapi-* 2>/dev/null || true

      - name: version
        id: ver
        run: |
          echo "v=$(jq -r .version cli/package.json)" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-binaries
          if-no-files-found: error
          path: stage/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAPI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.HAPI_UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Android SDK is preinstalled on GitHub ubuntu runners (licenses
      # accepted); AGP auto-installs any missing platform/build-tools.
      - uses: gradle/actions/setup-gradle@v4
      - name: Install fork upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.HAPI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$HAPI_UPLOAD_KEYSTORE_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/hapi-upload.keystore"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s\n' "HAPI_UPLOAD_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: version
        id: aver
        run: |
          v="$(jq -r .version ../cli/package.json)"
          vc="$(date +%Y%m%d)$(printf '%02d' $(( ${{ github.run_number }} % 100 )))"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "vc=$vc" >> "$GITHUB_OUTPUT"
          echo "versionCode=$vc versionName=$v"
      - name: Test and build signed release APK
        run: |
          ./gradlew \
            -PhapiVersionCode="${{ steps.aver.outputs.vc }}" \
            -PhapiVersionName="${{ steps.aver.outputs.v }}" \
            :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest \
            :app:assembleRelease
      - name: Verify APK signed with the fork key
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)"
          case "$apk" in
            *unsigned*) echo "::error::unsigned APK produced: $apk"; exit 1 ;;
          esac
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q 'CN=hapi upload' certs.txt || { echo '::error::APK not signed with the fork upload key'; exit 1; }
      - name: stage APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/stage"
          tag="${{ inputs.tag || 'latest' }}"
          if [ "$tag" = "latest" ]; then
            # Rolling asset: fixed name so each build replaces it instead of
            # piling up dated files; the embedded versionCode still increases.
            name="hapi-android-latest.apk"
          else
            name="hapi-android-${{ steps.aver.outputs.v }}-${{ steps.aver.outputs.vc }}.apk"
          fi
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/stage/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          if-no-files-found: error
          path: stage/

  # WebView shell APK (android-web/, fork-only long line — never PR'd upstream).
  # Mirrors the `android` job: same keystore secrets (constant signing
  # identity), same versionName/versionCode source and formula, same
  # latest/pinned naming scheme — but produces the hapi-web-*.apk alongside
  # the native client. Needs web/dist for the bundled static layer, which the
  # binaries job does not build, so it is built here the same way webapp.yml
  # does it.
  android-web:
    runs-on: ubuntu-latest
    env:
      HAPI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.HAPI_UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Bundled layer input: web/dist (checked fail-loud by checkWebDist).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build web dist
        run: |
          bun install --frozen-lockfile
          bun run --cwd web build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Android SDK is preinstalled on GitHub ubuntu runners (licenses
      # accepted); AGP auto-installs any missing platform/build-tools.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install fork upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.HAPI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$HAPI_UPLOAD_KEYSTORE_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/hapi-upload.keystore"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s\n' "HAPI_UPLOAD_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: version
        id: aver
        working-directory: android-web
        run: |
          v="$(jq -r .version ../cli/package.json)"
          vc="$(date +%Y%m%d)$(printf '%02d' $(( ${{ github.run_number }} % 100 )))"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "vc=$vc" >> "$GITHUB_OUTPUT"
          echo "versionCode=$vc versionName=$v"

      - name: Test and build signed release APK
        working-directory: android-web
        run: |
          ./gradlew \
            -PhapiVersionCode="${{ steps.aver.outputs.vc }}" \
            -PhapiVersionName="${{ steps.aver.outputs.v }}" \
            :app:testDebugUnitTest \
            :app:assembleRelease

      - name: Verify APK signed with the fork key
        working-directory: android-web
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)"
          case "$apk" in
              *unsigned*) echo "::error::unsigned APK produced: $apk"; exit 1 ;;
          esac
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q 'CN=hapi upload' certs.txt || { echo '::error::APK not signed with the fork upload key'; exit 1; }

      - name: stage APK
        working-directory: android-web
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/stage"
          tag="${{ inputs.tag || 'latest' }}"
          if [ "$tag" = "latest" ]; then
            # Rolling asset: fixed name (mirrors hapi-android-latest.apk).
            name="hapi-web-latest.apk"
          else
            name="hapi-web-${{ steps.aver.outputs.v }}-${{ steps.aver.outputs.vc }}.apk"
          fi
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/stage/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-web
          if-no-files-found: error
          path: stage/

  release:
    needs: [binaries, android, android-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: stage and checksum
        run: |
          set -e
          mkdir -p stage
          cp all/dist-binaries/* all/dist-android/* all/dist-android-web/* stage/
          chmod +x stage/hapi-* 2>/dev/null || true
          cd stage
          sha256sum hapi-* > checksums.sha256
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.binaries.outputs.tag }}
          name: hapi ${{ needs.binaries.outputs.v }} (stripped)
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of **hapi ${{ needs.binaries.outputs.v }}** with the embedded
            `tunwg` / WireGuard tunnel component stripped.

            Built from `${{ github.repository }}` `${{ github.ref_name }}` @ ${{ github.sha }}.
            The strip patch is [`patches/strip-tunwg.patch`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/patches/strip-tunwg.patch).

            ## Install (macOS / Linux)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            (installs the rolling `latest` release)

            ## Android
            `hapi-android-*.apk` — native Android client (Android 8.0+), built from the
            same commit and signed with this fork's upload key. Firebase-free build: all
            session features work; FCM push is unavailable. Pair with your hub via the
            web **Settings → Companion pairing** QR, a `hapicompanion://bind` link, or
            manual hub URL + access token (HTTPS required).

            `hapi-web-*.apk` — WebView shell (`run.hapi.web`): the hub's web UI in a
            minimal wrapper with three-layer static serving (OTA > bundled > network) and
            hot updates. Independent of the native client — install either or both.

            ## Verify
            Each binary is scanner-clean: `grep -aci wireguard hapi-*` → `0`.
            See `checksums.sha256`.

            ## What's removed
            Only the embedded `tunwg` binary (used solely by the optional
            `hapi hub --relay` public-relay feature). All other features — self-hosted
            hub, runner, sessions, web UI — are identical to upstream. The Android APK
            never embedded tunwg and is built unmodified.
          files: |
            stage/*
          make_latest: ${{ needs.binaries.outputs.tag == 'latest' && 'true' || 'false' }}
          prerelease: false
